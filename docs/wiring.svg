<text x="72" y="241" font-size="14" text-anchor="start" font-weight="600" fill="#bc4c00">Battery sense</text>
<text x="72" y="260" font-size="12" text-anchor="start" font-weight="400" fill="#424a53">junction of R1, R2, C1 (divider below)</text>
<line x1="360" y1="303" x2="442" y2="303" stroke="#8250df" stroke-width="3" stroke-linecap="round"/>
<rect x="60" y="279" width="300" height="48" rx="6" fill="#fbefff" stroke="#8250df" stroke-width="1.5"/>
<text x="72" y="299" font-size="14" text-anchor="start" font-weight="600" fill="#8250df">NFC 4 Click: IRQ</text>
<text x="72" y="318" font-size="12" text-anchor="start" font-weight="400" fill="#424a53">wakes the doorbell when a phone arrives</text>
<line x1="360" y1="361" x2="442" y2="361" stroke="#1a7f37" stroke-width="3" stroke-linecap="round"/>
<rect x="60" y="337" width="300" height="48" rx="6" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
<text x="72" y="357" font-size="14" text-anchor="start" font-weight="600" fill="#1a7f37">Doorbell button</text>
<text x="72" y="376" font-size="12" text-anchor="start" font-weight="400" fill="#424a53">other leg to GND; diagonal pins on a 4-pin switch</text>
<text x="430" y="424" font-size="12" text-anchor="end" font-weight="400" fill="#8c959f" font-style="italic">not used</text>
