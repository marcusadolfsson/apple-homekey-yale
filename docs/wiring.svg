<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 990" width="1100" height="990" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<rect width="1100" height="990" fill="#ffffff"/>
<text x="40" y="44" font-size="22" text-anchor="start" font-weight="600" fill="#1f2328">Doorbell wiring – production board</text>
<text x="40" y="68" font-size="13" text-anchor="start" font-weight="400" fill="#57606a">Seeed XIAO ESP32C6 + MikroE NFC 4 Click (ST25R3916, reworked to I2C) + 1S LiPo. Pins as in relay-doorbell firmware, 2026-10-08.</text>
<rect x="450" y="150" width="200" height="470" rx="14" fill="#2d333b" stroke="#1f2328" stroke-width="2"/>
<rect x="520.0" y="128" width="60" height="30" rx="5" fill="#afb8c1" stroke="#57606a" stroke-width="1.5"/>
<text x="550.0" y="148" font-size="11" text-anchor="middle" font-weight="600" fill="#24292f">USB-C</text>
<text x="550.0" y="184" font-size="16" text-anchor="middle" font-weight="600" fill="#ffffff">XIAO ESP32C6</text>
<text x="550.0" y="204" font-size="12" text-anchor="middle" font-weight="400" fill="#adbac7" font-style="italic">top view</text>
<circle cx="450" cy="245" r="7" fill="#d4a72c"/>
<text x="464" y="250" font-size="14" text-anchor="start" font-weight="600" fill="#ffffff">D0</text>
<text x="496" y="250" font-size="10" text-anchor="start" font-weight="400" fill="#adbac7">A0 / GPIO0</text>
<circle cx="450" cy="303" r="7" fill="#d4a72c"/>
<text x="464" y="308" font-size="14" text-anchor="start" font-weight="600" fill="#ffffff">D1</text>
<text x="496" y="308" font-size="10" text-anchor="start" font-weight="400" fill="#adbac7">GPIO1</text>
<circle cx="450" cy="361" r="7" fill="#d4a72c"/>
<text x="464" y="366" font-size="14" text-anchor="start" font-weight="600" fill="#ffffff">D2</text>
<text x="496" y="366" font-size="10" text-anchor="start" font-weight="400" fill="#adbac7">GPIO2</text>
<circle cx="450" cy="419" r="7" fill="#d4a72c"/>
<text x="464" y="424" font-size="14" text-anchor="start" font-weight="600" fill="#ffffff">D3</text>
<text x="496" y="424" font-size="10" text-anchor="start" font-weight="400" fill="#adbac7">GPIO21</text>
<circle cx="450" cy="477" r="7" fill="#d4a72c"/>
<text x="464" y="482" font-size="14" text-anchor="start" font-weight="600" fill="#ffffff">D4</text>
<text x="496" y="482" font-size="10" text-anchor="start" font-weight="400" fill="#adbac7">GPIO22</text>
