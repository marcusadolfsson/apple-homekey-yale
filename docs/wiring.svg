<text x="636" y="424" font-size="14" text-anchor="end" font-weight="600" fill="#ffffff">D10</text>
<text x="602" y="424" font-size="10" text-anchor="end" font-weight="400" fill="#adbac7">GPIO18</text>
<circle cx="650" cy="477" r="7" fill="#d4a72c"/>
<text x="636" y="482" font-size="14" text-anchor="end" font-weight="600" fill="#ffffff">D9</text>
<text x="602" y="482" font-size="10" text-anchor="end" font-weight="400" fill="#adbac7">GPIO20</text>
<circle cx="650" cy="535" r="7" fill="#d4a72c"/>
<text x="636" y="540" font-size="14" text-anchor="end" font-weight="600" fill="#ffffff">D8</text>
<text x="602" y="540" font-size="10" text-anchor="end" font-weight="400" fill="#adbac7">GPIO19</text>
<circle cx="650" cy="593" r="7" fill="#d4a72c"/>
<text x="636" y="598" font-size="14" text-anchor="end" font-weight="600" fill="#ffffff">D7</text>
<text x="602" y="598" font-size="10" text-anchor="end" font-weight="400" fill="#adbac7">GPIO17</text>
<line x1="360" y1="245" x2="442" y2="245" stroke="#bc4c00" stroke-width="3" stroke-linecap="round"/>
