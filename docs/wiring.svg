<text x="464" y="598" font-size="14" text-anchor="start" font-weight="600" fill="#ffffff">D6</text>
<text x="496" y="598" font-size="10" text-anchor="start" font-weight="400" fill="#adbac7">GPIO16</text>
<circle cx="650" cy="245" r="7" fill="#d4a72c"/>
<text x="636" y="250" font-size="14" text-anchor="end" font-weight="600" fill="#ffffff">5V</text>
<circle cx="650" cy="303" r="7" fill="#d4a72c"/>
<text x="636" y="308" font-size="14" text-anchor="end" font-weight="600" fill="#ffffff">GND</text>
<circle cx="650" cy="361" r="7" fill="#d4a72c"/>
<text x="636" y="366" font-size="14" text-anchor="end" font-weight="600" fill="#ffffff">3V3</text>
